# Publishes the website whenever content or code changes on main (including edits saved in the Pages CMS admin panel).
# Builds the static site, pushes it to the `deploy` branch, then calls /api/publish.php so the server installs it.
name: Publish website
on:
  push:
    branches: [main]
    paths: ["content/**", "src/**", "public/**", "scripts/**", "package.json", "package-lock.json", "next.config.ts", ".github/workflows/publish.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check content + build
        # scripts/prepare-content.mjs runs first (prebuild): it fixes/skips unsafe edits and writes a report to this run's Summary.
        run: npm run build
      - name: Push build to deploy branch
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git clone -q --depth 1 --branch deploy "$REPO_URL" site-deploy
          cd site-deploy
          git rm -rq --ignore-unmatch . && git clean -fdxq
          cp -a ../out/. .
          git config user.name "Keelbiz publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git commit -q -m "Publish website (main ${GITHUB_SHA::7})"
          git push -q origin deploy
      - name: Tell the server to install the new build
        env:
          PUBLISH_HOOK: ${{ vars.PUBLISH_HOOK_URL || 'https://keelbiz.com/api/publish.php' }}
          FALLBACK_HOOK: https://paleturquoise-dogfish-291071.hostingersite.com/api/publish.php
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
        run: |
          # --max-time: Hostinger sometimes stalls requests from GitHub's runners; fail fast and retry instead of hanging.
          for i in 1 2 3 4 5 6; do
            sleep $((i * 10))
            hook="$PUBLISH_HOOK"; [ $((i % 2)) -eq 0 ] && hook="$FALLBACK_HOOK"  # alternate with the temporary address while DNS settles
            res=$(curl -sS --connect-timeout 15 --max-time 60 -X POST -A "Mozilla/5.0 (compatible; KeelbizPublisher/1.0; +https://github.com/${{ github.repository }})" -H "Accept: application/json" -H "X-Publish-Key: $PUBLISH_KEY" "$hook" -w ' HTTP%{http_code}' 2>&1 | head -c 600 || true)
            echo "$res"
            case "$res" in *'"ok":true'*) exit 0;; esac
          done
          echo "::error::The server did not confirm the update. The new build is ready on the deploy branch — re-run this job, or open $PUBLISH_HOOK's site and run the publish hook again."; exit 1
