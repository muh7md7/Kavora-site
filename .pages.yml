content:
- name: theme
  label: 🎨 Design & theme
  description: Colours, fonts, corners, buttons, spacing, effects and brand files for the whole website. Unsafe colour choices are corrected automatically for readability.
  type: file
  path: content/theme.json
  fields:
  - name: colours
    label: Colours
    type: object
    fields:
    - name: preset
      label: Colour scheme
      type: select
      options:
        values:
        - name: stone-steel
          label: Stone & Steel (current)
        - name: porcelain-navy
          label: Porcelain & Navy
        - name: sand-olive
          label: Sand & Olive
        - name: linen-clay
          label: Linen & Clay
        - name: fog-forest
          label: Fog & Forest
        - name: mono
          label: Monochrome
        - name: custom
          label: Custom colours (below)
      default: stone-steel
      description: Presets are tested for readability. Choose Custom to use your own colours below.
    - name: custom
      label: Custom colours (only used when scheme = Custom)
      type: object
      fields:
      - name: background
        label: Page background
        type: string
        description: 'Light — hex code like #233845. Leave empty to keep the Stone & Steel colour.'
      - name: surface
        label: Soft surface
        type: string
        description: 'Light, for alternating sections — hex code like #233845. Leave empty to keep the Stone & Steel colour.'
      - name: surfaceDeep
        label: Mid-tone surface
        type: string
        description: 'Slightly darker light tone, for cards and previews — hex code like #233845. Leave empty to keep the Stone & Steel colour.'
      - name: accent
        label: Accent
        type: string
        description: 'Lines, glows, highlights — hex code like #233845. Leave empty to keep the Stone & Steel colour.'
      - name: accentSecondary
        label: Secondary accent
        type: string
        description: 'Supporting tone — hex code like #233845. Leave empty to keep the Stone & Steel colour.'
      - name: dark
        label: Dark sections
        type: string
        description: 'Deep colour for dark bands and the footer — hex code like #233845. Leave empty to keep the Stone & Steel colour.'
      - name: text
        label: Text
        type: string
        description: 'Main text colour — hex code like #233845. Leave empty to keep the Stone & Steel colour.'
  - name: fonts
    label: Fonts
    type: object
    fields:
    - name: headings
      label: Headings
      type: select
      options:
        values:
        - name: geist
          label: Geist (current)
        - name: inter
          label: Inter
        - name: manrope
          label: Manrope
        - name: plus-jakarta-sans
          label: Plus Jakarta Sans
        - name: dm-sans
          label: DM Sans
        - name: outfit
          label: Outfit
        - name: sora
          label: Sora
        - name: space-grotesk
          label: Space Grotesk
        - name: fraunces
          label: Fraunces (serif)
        - name: playfair-display
          label: Playfair Display (serif)
        - name: cormorant-garamond
          label: Cormorant Garamond (serif)
      default: geist
    - name: body
      label: Body text
      type: select
      options:
        values:
        - name: geist
          label: Geist (current)
        - name: inter
          label: Inter
        - name: manrope
          label: Manrope
        - name: plus-jakarta-sans
          label: Plus Jakarta Sans
        - name: dm-sans
          label: DM Sans
        - name: outfit
          label: Outfit
        - name: sora
          label: Sora
      default: geist
    - name: accent
      label: Accent word style
      type: select
      options:
        values:
        - name: instrument-serif
          label: Instrument Serif italic (current)
        - name: fraunces
          label: Fraunces italic
        - name: playfair-display
          label: Playfair Display italic
        - name: cormorant-garamond
          label: Cormorant Garamond italic
        - name: none
          label: No special style (accent colour only)
      default: instrument-serif
  - name: corners
    label: Corner roundness
    type: select
    options:
      values:
      - name: sharp
        label: Sharp
      - name: soft
        label: Soft
      - name: rounded
        label: Rounded (current)
      - name: round
        label: Extra round
    default: rounded
  - name: buttons
    label: Buttons
    type: object
    fields:
    - name: shape
      label: Shape
      type: select
      options:
        values:
        - name: pill
          label: Pill (current)
        - name: rounded
          label: Rounded rectangle
        - name: square
          label: Square
      default: pill
    - name: style
      label: Main button style
      type: select
      options:
        values:
        - name: solid
          label: Solid dark (current)
        - name: accent
          label: Accent colour
