# Keelbiz admin panel (Pages CMS). Open https://app.pagescms.org, sign in with GitHub and pick muh7md7/Kavora-site.
# Saving an edit commits to main; the "Publish website" GitHub Action rebuilds and publishes automatically.
# Design system + page builder: content/theme.json, home-layout.json, custom-pages/*.json, navigation.json
# are checked and turned into CSS/routes by scripts/prepare-content.mjs before every build.
media:
  input: public/uploads
  output: /uploads
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - avif
  - gif
  - svg
