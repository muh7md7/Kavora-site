# Keelbiz admin panel (Pages CMS). Open https://app.pagescms.org, sign in with GitHub and pick muh7md7/Kavora-site.
# Saving an edit commits to main; the "Publish website" GitHub Action rebuilds and deploys automatically.
content:
- name: settings
  label: ⚙️ Business details & footer
  description: Brand name, contact details, social links and the closing call-to-action. Leave a contact field empty to hide it on the website.
  type: file
  path: content/settings.json
  fields:
  - name: brand
    label: Business name
    type: string
    required: true
  - name: positioning
    label: Tagline
    type: string
  - name: supporting
    label: Short description of the business
    type: text
  - name: contact
    label: Contact details
    type: object
    fields:
    - name: email
      label: Public email address
      type: string
      description: Shown on the website when filled in
    - name: phone
      label: Phone number
      type: string
    - name: whatsapp
      label: WhatsApp number
      type: string
      description: International format, e.g. +971500000000
    description: Only fill in details you want visitors to see.
  - name: socials
    label: Social media links
    type: object
    fields:
    - name: instagram
      label: Instagram link
      type: string
      description: Full link, e.g. https://instagram.com/keelbiz
    - name: linkedin
      label: LinkedIn link
      type: string
    - name: facebook
      label: Facebook link
      type: string
  - name: thirdPartyNote
    label: Third-party costs note
    type: text
    description: Shown wherever pricing is mentioned
  - name: footer
    label: Closing call-to-action (bottom of every page)
    type: object
    fields:
    - name: eyebrow
      label: Small label
      type: string
    - name: title
      label: Heading — first part
      type: string
    - name: accent
      label: Accent word (italic)
      type: string
    - name: lead
      label: Paragraph
      type: text
    - name: primaryButton
      label: Main button text
      type: string
    - name: secondaryButton
      label: Second button text
      type: string
    - name: tagline
      label: Footer tagline
      type: string
- name: home
  label: 🏠 Home page
  description: Every heading and paragraph on the home page.
  type: file
  path: content/home.json
  fields:
