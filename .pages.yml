- name: services
  label: 🧩 Services
  description: The five services and their pages. Edit text freely; keep exactly five services.
  type: file
  path: content/services.json
  fields:
  - name: services
    label: Services
    type: object
    fields:
    - name: name
      label: Service name
      type: string
      required: true
    - name: short
      label: One-line summary
      type: text
    - name: definition
      label: Main description (top of the service page)
      type: text
    - name: forWho
      label: Who it's for
      type: text
    - name: cta
      label: Button text
      type: string
      description: e.g. Get a Proposal
    - name: benefits
      label: Benefits (3 recommended)
      type: string
      list: true
    - name: capabilities
      label: What we offer
      type: string
      list: true
    - name: deliverables
      label: What you get
      type: string
      list: true
    - name: useCases
      label: Use cases
      type: string
      list: true
    - name: pairsWith
      label: Works well with
      type: object
      fields:
      - name: id
        label: Other service
        type: select
        options:
          values: &id001
          - websites
          - social
          - ads
          - automation
          - dashboards
      - name: why
        label: Why they work together
        type: string
      list: true
    - name: faq
      label: FAQ
      type: object
      fields:
      - name: q
        label: Question
        type: string
        required: true
      - name: a
        label: Answer
        type: text
        required: true
      list: true
    list:
      min: 5
      max: 5
- name: shared
  label: 🔁 Process, reasons & FAQ
  description: Content used on several pages.
  type: file
  path: content/shared.json
  fields:
  - name: steps
    label: Process steps
    type: object
    fields:
    - name: n
      label: Number
      type: string
    - name: name
      label: Step name
      type: string
    - name: text
      label: Description
      type: text
    list: true
  - name: whyUs
    label: Reasons to choose Keelbiz
    type: object
    fields:
    - name: t
      label: Title
      type: string
    - name: d
      label: Description
      type: text
    list: true
  - name: combinations
    label: Example service combinations
    type: object
    fields:
    - name: title
      label: Title
      type: string
    - name: ids
      label: Services included
      type: select
      options:
        values: *id001
        multiple: true
    - name: note
      label: Note
      type: text
    list: true
  - name: flywheel
    label: Loop diagram (About page)
    type: object
    fields:
    - name: step
      label: Stage
      type: string
    - name: detail
      label: Detail
      type: string
    list:
      min: 4
      max: 4
  - name: homeFaq
    label: Home page FAQ
    type: object
    fields:
    - name: q
      label: Question
      type: string
      required: true
    - name: a
      label: Answer
      type: text
      required: true
    list: true
- name: ai
